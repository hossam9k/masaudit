[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masaudit"
dynamic = ["version"]
description = "A free mobile security scanner that scales its advice to your app's risk profile."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0 AND MIT-0 AND CC-BY-SA-4.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Hossam Atef", email = "hossam9k@gmail.com" }]
keywords = ["security", "mobile", "android", "ios", "react-native", "flutter", "masvs", "sast", "sarif"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/hossam9k/masaudit"
Documentation = "https://github.com/hossam9k/masaudit/blob/main/docs/README.md"
Source = "https://github.com/hossam9k/masaudit"
Issues = "https://github.com/hossam9k/masaudit/issues"
Changelog = "https://github.com/hossam9k/masaudit/blob/main/CHANGELOG.md"
Book = "https://github.com/hossam9k/mobile-app-security"
Sponsor = "https://github.com/sponsors/hossam9k"

[project.scripts]
masaudit = "masaudit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "masaudit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
masaudit = ["rules/*.json"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests", "fuzz", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
