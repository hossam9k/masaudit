# Tests on every push and pull request. Follows the book's §15.3: SHA-pinned actions,
# a token that can do nothing by default, no stored credentials.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: tests
        shell: bash
        # On failure, the last part of the output becomes a public annotation, so anyone can see
        # why a run failed without signing in to read the log.
        run: |
          if ! python -m unittest -v > "$RUNNER_TEMP/unittest.txt" 2>&1; then
            cat "$RUNNER_TEMP/unittest.txt"
            python ../scripts/ci_annotate.py "$RUNNER_TEMP/unittest.txt"
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/unittest.txt"
      - name: Zipapp builds and runs offline
        run: |
          python scripts/build_zipapp.py
          python dist/masaudit.pyz tests/fixtures/AND-001/vulnerable --app-type banking --format json --output "$RUNNER_TEMP/report.json"

  generated-files:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Sample report, rules doc, and bundled skill scanner are up to date
        run: |
          python scripts/generate.py
          git diff --exit-code || { echo "::error::Run 'python scripts/generate.py' and commit the result"; exit 1; }

  # Runs the published Action itself, so a broken action.yml fails here, not for users.
  action:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          path: examples/acme-wallet
          app-type: banking
          fail-on: none
          upload-sarif: "false"
      - name: Action wrote both reports
        run: test -s masaudit.sarif && test -s SECURITY-AUDIT.md

  # Coverage-guided fuzzing of every parser that reads untrusted repository files.
  fuzz:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fuzz parsers for 2 minutes
        run: |
          python -m pip install --require-hashes --only-binary :all: -r fuzz/requirements.txt
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/crash"
          python fuzz/fuzz_parsers.py -max_total_time=120 -timeout=5 -rss_limit_mb=2048 \
            -artifact_prefix="$RUNNER_TEMP/crash/" "$RUNNER_TEMP/corpus" tests/fixtures
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: ${{ runner.temp }}/crash/
