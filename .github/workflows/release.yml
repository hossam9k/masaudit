# Publishes a tagged release: PyPI (trusted publishing, no stored token), a single-file
# zipapp, checksums, and build provenance.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/masaudit/__init__.py)
          if [ "v$version" != "$TAG" ]; then
            echo "::error title=release::Tag $TAG doesn't match __version__ $version"
            exit 1
          fi
      - name: Build sdist, wheel, and zipapp
        run: |
          python -m pip install --require-hashes -r scripts/build-requirements.txt
          python -m build --no-isolation
          SOURCE_DATE_EPOCH=1767225600 python scripts/build_zipapp.py   # same bytes as the skill's bundled copy
      - name: The wheel holds every module and rule file, and scans
        run: |
          # Unpacked rather than pip-installed: the check is that nothing the package needs is missing.
          python -m zipfile -e dist/masaudit-*.whl "$RUNNER_TEMP/wheel"
          python -I -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); sys.argv[0] = "masaudit"; from masaudit.cli import main; sys.exit(main())' \
            "$RUNNER_TEMP/wheel" tests/fixtures/RN-001/vulnerable --app-type banking --format json --output "$RUNNER_TEMP/report.json" || [ $? = 1 ]
          grep -q '"rule_id": "RN-001"' "$RUNNER_TEMP/report.json"
          python dist/masaudit.pyz tests/fixtures/RN-001/vulnerable --app-type banking --format json --output "$RUNNER_TEMP/pyz.json" || [ $? = 1 ]
          grep -q '"rule_id": "RN-001"' "$RUNNER_TEMP/pyz.json"
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write          # trusted publishing; no PyPI token is stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Keep only the Python packages
        run: rm -f dist/masaudit.pyz dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Only after the reviewer approved the pypi environment and PyPI accepted the packages.
  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create the release
      id-token: write          # sign provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*
      - name: Attach the signed provenance to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/masaudit.sigstore.json
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
