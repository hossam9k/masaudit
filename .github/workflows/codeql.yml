# CodeQL static analysis of masaudit's own Python and workflows.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 2"

permissions: {}

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
