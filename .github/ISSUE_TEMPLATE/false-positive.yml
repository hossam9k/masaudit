name: False positive
description: masaudit reported something that isn't a real problem in your app.
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: AND-001
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: masaudit version
      description: Output of `masaudit --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Kotlin Multiplatform, GitHub Actions, Other]
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Smallest snippet that triggers it
      description: Remove anything secret or proprietary. A few lines is enough.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it's not a problem here
    validations:
      required: true
