name: masaudit
description: Free mobile security scan for Android, iOS, React Native, KMP, and Flutter that scales its advice to your app's risk.
author: Hossam Atef
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Project folder to scan.
    default: "."
  app-type:
    description: "banking, identity, health, ecommerce-cards, ecommerce, loyalty, marketplace, social, content, device-control, enterprise, game, or general. Default: the app type saved in .masaudit.ini, else general."
    default: ""
  fail-on:
    description: "Fail the job on findings at or above: critical, high, medium, low, or none. Default: fail_on in .masaudit.ini, else high. none never fails on findings."
    default: ""
  baseline:
    description: "Baseline file from `masaudit --update-baseline`, relative to the repository root. Findings in it are accepted and don't fail the job."
    default: ""
  upload-sarif:
    description: "Upload results to GitHub code scanning (needs `security-events: write`)."
    default: "true"
  category:
    description: "Code-scanning category. Use a different one for each `path` you scan in the same repository."
    default: "masaudit"

runs:
  using: composite
  steps:
    # The scanner runs from this action's own pinned source: no download, no network. Every Python call
    # is isolated (-I): the working directory is the scanned repository, so without it a `json.py` or a
    # `masaudit/` folder there would be imported instead of the standard library or the scanner.
    - name: Scan
      id: scan
      shell: bash
      env:
        MASAUDIT_PATH: ${{ inputs.path }}
        MASAUDIT_APP_TYPE: ${{ inputs.app-type }}
        MASAUDIT_FAIL_ON: ${{ inputs.fail-on }}
        MASAUDIT_BASELINE: ${{ inputs.baseline }}
        MASAUDIT_SRC: ${{ github.action_path }}/src
      run: |
        set +e
        masaudit() {
          python3 -I -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); sys.argv[0] = "masaudit"; from masaudit.cli import main; sys.exit(main())' "$MASAUDIT_SRC" "$@"
        }
        # Empty inputs defer to the repository's .masaudit.ini (the command line would override it).
        type_args=()
        if [ -n "$MASAUDIT_APP_TYPE" ]; then type_args=(--app-type "$MASAUDIT_APP_TYPE"); fi
        baseline_args=()
        if [ -n "$MASAUDIT_BASELINE" ]; then baseline_args=(--baseline "$MASAUDIT_BASELINE"); fi
        if [ -z "$MASAUDIT_FAIL_ON" ]; then
          # Read fail_on the way masaudit does; an invalid file fails the scan below with a clear message.
          MASAUDIT_FAIL_ON=$(python3 -I -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); from masaudit import config; print(config.load(sys.argv[1])["fail_on"] or "high")' "$MASAUDIT_SRC" "$MASAUDIT_PATH" 2>/dev/null || echo high)
        fi
        fail_args=()
        if [ "$MASAUDIT_FAIL_ON" != "none" ]; then fail_args=(--fail-on "$MASAUDIT_FAIL_ON"); fi
        masaudit "${type_args[@]}" "${baseline_args[@]}" "${fail_args[@]}" \
          --format sarif --output masaudit.sarif -- "$MASAUDIT_PATH"
        rc=$?
        # `none` never fails on findings, even when .masaudit.ini sets fail_on.
        if [ "$MASAUDIT_FAIL_ON" = "none" ] && [ "$rc" = "1" ]; then rc=0; fi
        if [ "$rc" -ge 2 ]; then
          echo "::error title=masaudit::The scan failed (exit code $rc). See the message above."
          exit "$rc"
        fi
        # SARIF paths are relative to the scanned folder; code scanning resolves them from the checkout.
        python3 -I - "$MASAUDIT_PATH" masaudit.sarif <<'PY'
        import json, os, sys
        from urllib.parse import quote
        prefix = os.path.relpath(os.path.abspath(sys.argv[1]), os.getcwd()).replace(os.sep, "/")
        if prefix != "." and not prefix.startswith(".."):
            with open(sys.argv[2], encoding="utf-8") as fh:
                doc = json.load(fh)
            for run in doc["runs"]:
                locations = [loc for res in run.get("results", []) for loc in res.get("locations", [])]
                locations += [loc for inv in run.get("invocations", [])
                              for note in inv.get("toolConfigurationNotifications", [])
                              for loc in note.get("locations", [])]
                for loc in locations:
                    art = loc.get("physicalLocation", {}).get("artifactLocation", {})
                    if "uri" in art:
                        art["uri"] = quote(prefix, safe="/") + "/" + art["uri"]
            with open(sys.argv[2], "w", encoding="utf-8") as fh:
                json.dump(doc, fh, indent=2)
        PY
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        # The first run already posted any annotations; this one only writes the Markdown report.
        GITHUB_ACTIONS=false masaudit "${type_args[@]}" "${baseline_args[@]}" \
          --format md --output SECURITY-AUDIT.md -- "$MASAUDIT_PATH" > /dev/null 2>&1
        # The job summary is the report's opening: app type, verdict, and top fixes.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -s SECURITY-AUDIT.md ]; then
          python3 -I -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); from masaudit.report.markdown import job_summary; sys.stdout.write(job_summary(open(sys.argv[1], encoding="utf-8").read()))' "$MASAUDIT_SRC" SECURITY-AUDIT.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0
    - name: Upload to code scanning
      if: inputs.upload-sarif == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: masaudit.sarif
        category: ${{ inputs.category }}
    - name: Fail on findings
      shell: bash
      env:
        MASAUDIT_EXIT: ${{ steps.scan.outputs.exit-code }}
      run: exit "${MASAUDIT_EXIT:-0}"
