name: masaudit
description: Free mobile security scan for Android, iOS, KMP, and Flutter that scales its advice to your app's risk.
author: Hossam Atef
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Project directory to scan.
    default: "."
  app-type:
    description: "banking, identity, health, ecommerce-cards, ecommerce, loyalty, marketplace, social, content, device-control, enterprise, game, or general. Default: the app type saved in .masaudit.ini, else general."
    default: ""
  fail-on:
    description: "Fail the job on findings at or above: critical, high, medium, low, or none. Default: fail_on in .masaudit.ini, else high."
    default: ""
  baseline:
    description: "Baseline file from `masaudit --update-baseline`, relative to the repository root. Findings in it are accepted and don't fail the job."
    default: ""
  upload-sarif:
    description: "Upload results to GitHub code scanning (needs `security-events: write`)."
    default: "true"

runs:
  using: composite
  steps:
    # The scanner runs from this action's own pinned source: no download, no network.
    - name: Scan
      shell: bash
      env:
        MASAUDIT_PATH: ${{ inputs.path }}
        MASAUDIT_APP_TYPE: ${{ inputs.app-type }}
        MASAUDIT_FAIL_ON: ${{ inputs.fail-on }}
        MASAUDIT_BASELINE: ${{ inputs.baseline }}
        PYTHONPATH: ${{ github.action_path }}/src
      run: |
        set +e
        # Empty inputs defer to the repository's .masaudit.ini (the command line would override it).
        type_args=()
        if [ -n "$MASAUDIT_APP_TYPE" ]; then type_args=(--app-type "$MASAUDIT_APP_TYPE"); fi
        baseline_args=()
        if [ -n "$MASAUDIT_BASELINE" ]; then baseline_args=(--baseline "$MASAUDIT_BASELINE"); fi
        fail_args=()
        if [ -z "$MASAUDIT_FAIL_ON" ] && ! grep -qsE '^[[:space:]]*fail_on[[:space:]]*=' "$MASAUDIT_PATH/.masaudit.ini"; then
          MASAUDIT_FAIL_ON=high
        fi
        if [ -n "$MASAUDIT_FAIL_ON" ] && [ "$MASAUDIT_FAIL_ON" != "none" ]; then fail_args=(--fail-on "$MASAUDIT_FAIL_ON"); fi
        python3 -m masaudit "$MASAUDIT_PATH" "${type_args[@]}" --format sarif --output masaudit.sarif "${baseline_args[@]}" "${fail_args[@]}"
        echo "MASAUDIT_EXIT=$?" >> "$GITHUB_ENV"
        # The first run already posted any annotations; this one only writes the Markdown report.
        GITHUB_ACTIONS=false python3 -m masaudit "$MASAUDIT_PATH" "${type_args[@]}" "${baseline_args[@]}" --format md --output SECURITY-AUDIT.md > /dev/null 2>&1
        exit 0
    - name: Upload to code scanning
      if: inputs.upload-sarif == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: masaudit.sarif
        category: masaudit
    - name: Fail on findings
      shell: bash
      run: exit "${MASAUDIT_EXIT:-0}"
